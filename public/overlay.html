<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self' data:; base-uri 'none'; form-action 'none'">
    <title>IRIS | Reconstruction & Orb Constellation</title>
    <style>
        :root {
            --bg-glass: rgba(8, 12, 20, 0.75);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.35);
            --emerald: #10b981;
            --purple: #a855f7;
            --curve: cubic-bezier(0.16, 1, 0.3, 1);
            --curve-spring: cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* --- THE COGNITIVE VEIL --- */
        #veil {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0);
            z-index: 1;
            transition: background 0.4s var(--curve);
            pointer-events: none;
        }

        body.active #veil {
            background: rgba(3, 6, 12, 0.88);
            pointer-events: auto;
        }

        /* --- ORBITAL CANVAS --- */
        #orb-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s var(--curve);
        }

        body.active #orb-canvas {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- HOLOGRAPHIC TOOLTIP --- */
        #orb-tooltip {
            position: fixed;
            top: -1000px;
            left: -1000px;
            z-index: 20;
            background: rgba(12, 18, 30, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(-50%, -140%, 0);
            transition: opacity 0.2s var(--curve), transform 0.2s var(--curve);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 229, 255, 0.15);
            min-width: 180px;
            will-change: transform, opacity;
        }

        #orb-tooltip.visible {
            opacity: 1;
            transform: translate3d(-50%, -120%, 0);
        }

        .tt-icon {
            font-size: 1.2rem;
            margin-bottom: 6px;
            display: inline-block;
        }

        .tt-type {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .tt-title {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.35;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- HIGH PERFORMANCE CINEMATIC RESTORE SCREEN --- */
        #cinematic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 50% 40%, rgba(11, 17, 30, 0.96) 0%, rgba(3, 6, 12, 0.99) 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.4s var(--curve);
            will-change: opacity;
        }

        #cinematic-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Ambient Glow Behind Content */
        .cinematic-glow {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.14) 0%, rgba(168, 85, 247, 0.04) 45%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0) scale(0.8);
            opacity: 0;
            transition: transform 0.6s var(--curve), opacity 0.6s var(--curve);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
        }

        #cinematic-overlay.active .cinematic-glow {
            transform: translate3d(-50%, -50%, 0) scale(1.1);
            opacity: 1;
        }

        .cinematic-content {
            width: 860px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate3d(0, 20px, 0) scale(0.98);
            transition: transform 0.5s var(--curve), opacity 0.5s var(--curve);
            opacity: 0;
            z-index: 2;
            will-change: transform, opacity;
        }

        #cinematic-overlay.active .cinematic-content {
            transform: translate3d(0, 0, 0) scale(1);
            opacity: 1;
        }

        /* Header Elements */
        .cinematic-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.12);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulseDot 1.6s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        .cinematic-title {
            font-size: 2.35rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cinematic-subtitle-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 36px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: statusPulse 1.4s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
        }

        .cinematic-subtitle {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color 0.3s ease;
        }

        /* Card Hologram Stage */
        .hologram-stage {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            min-height: 195px;
            width: 100%;
            flex-wrap: wrap;
        }

        .holo-card {
            width: 230px;
            height: 185px;
            flex-shrink: 0;
            background: rgba(14, 20, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.06);
            opacity: 0;
            transform: translate3d(0, 24px, 0) scale(0.94);
            transition: transform 0.45s var(--curve), opacity 0.45s var(--curve), border-color 0.45s ease, box-shadow 0.45s ease;
            will-change: transform, opacity;
        }

        .holo-card.animate-in {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            border-color: rgba(0, 229, 255, 0.35);
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.75), 0 0 28px rgba(0, 229, 255, 0.18);
        }

        .mini-window {
            width: 100%;
            height: 125px;
            background: #0d121d;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .mini-header {
            height: 22px;
            background: #141b2b;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            gap: 5px;
        }

        .dots { display: flex; gap: 5px; }
        .dots span { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dots span:nth-child(1) { background: #ff5f56; }
        .dots span:nth-child(2) { background: #ffbd2e; }
        .dots span:nth-child(3) { background: #27c93f; }

        .mini-body {
            flex: 1;
            background: #090d15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
            overflow: hidden;
        }

        .mini-icon-glow {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
            animation: iconFloat 2.5s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .mini-code-lines {
            width: 80%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .mini-line {
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
        }

        .mini-line.accent {
            background: var(--accent);
            opacity: 0.6;
        }

        .holo-subtitle {
            font-size: 0.84rem;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            padding: 0 4px;
        }

        /* Progress Bar */
        .cinematic-progress-bar {
            width: 380px;
            max-width: 80vw;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
            opacity: 0;
            transform: translate3d(0, 10px, 0);
            transition: opacity 0.4s var(--curve), transform 0.4s var(--curve);
        }

        .cinematic-progress-bar.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .cinematic-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #10b981);
            box-shadow: 0 0 12px #00e5ff;
            border-radius: 4px;
            transition: width 0.4s var(--curve);
        }

        /* Completion Summary Badge */
        .cinematic-summary {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0;
            transform: translate3d(0, 12px, 0);
            transition: transform 0.45s var(--curve), opacity 0.45s var(--curve);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.15);
        }

        .cinematic-summary.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #10b981;
            color: #000;
            font-weight: 700;
            font-size: 0.72rem;
        }

    </style>
</head>
<body>
    <div id="veil"></div>
    <canvas id="orb-canvas"></canvas>
    
    <div id="orb-tooltip">
        <div class="tt-icon" id="tt-icon">✨</div>
        <div class="tt-type" id="tt-type">Type</div>
        <div class="tt-title" id="tt-title">Title</div>
    </div>

    <!-- HIGH PERFORMANCE CINEMATIC OVERLAY -->
    <div id="cinematic-overlay">
        <div class="cinematic-glow"></div>
        <div class="cinematic-content">
            <div class="cinematic-badge">
                <span class="badge-dot"></span>
                <span>METASPACE ENGINE</span>
            </div>
            <div class="cinematic-title" id="c-title">Reconstructing Workspace</div>
            <div class="cinematic-subtitle-wrapper">
                <span class="status-dot"></span>
                <span class="cinematic-subtitle" id="c-subtitle">Initializing cognitive anchors...</span>
            </div>
            
            <div class="hologram-stage" id="c-items"></div>
            
            <div class="cinematic-progress-bar" id="c-progress-bar">
                <div class="cinematic-progress-fill" id="c-progress-fill"></div>
            </div>

            <div class="cinematic-summary" id="c-summary">
                <span class="check-icon">✓</span>
                <span id="c-summary-text">Workspace reconstructed successfully.</span>
            </div>
        </div>
    </div>

    <script>
        const irisBridge = window.electronAPI;

        // --- ORBITAL PHYSICS CANVAS (PAUSED WHEN NOT ACTIVE) ---
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const tooltip = document.getElementById('orb-tooltip');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        let center = { x: width / 2, y: height / 2 };
        
        let nodes = [];
        let globalAngleOffset = 0;
        let hoveredNode = null;
        let mousePos = { x: -1000, y: -1000 };
        let isCanvasRunning = false;
        let animationFrameId = null;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.resetTransform();
            ctx.scale(dpr, dpr);
            center = { x: width / 2, y: height / 2 };
        }
        window.addEventListener('resize', resize);
        resize();

        // Optimized Parallax stars (reduced count for peak performance)
        const stars = Array.from({ length: 70 }, () => ({
            x: Math.random() * 2000,
            y: Math.random() * 2000,
            size: Math.random() * 1.4 + 0.6,
            speed: Math.random() * 0.04 + 0.01
        }));

        irisBridge.onWorkflowUpdate((workflowSession) => {
            nodes = [];
            
            // Center Sun (Workspace)
            nodes.push({
                isCenter: true,
                title: workflowSession.name || "Ambient Flow",
                type: "Active Workflow",
                icon: "🧠",
                radius: 36,
                color: "#00e5ff",
                orbitRadius: 0,
                baseAngle: 0,
                x: center.x,
                y: center.y
            });
            
            // Build orbits
            const apps = workflowSession.dominantApps || [];
            const urls = workflowSession.urls || [];
            const files = workflowSession.files || [];
            
            const addOrbitRing = (items, type, icon, orbitRadius, color, baseSpeed) => {
                const count = items.length;
                if (!count) return;
                items.forEach((item, i) => {
                    let title = item;
                    if (type === "Research") {
                        try { title = new URL(item).hostname.replace('www.',''); } catch(e){}
                    } else if (type === "File Editor") {
                        title = item.split(/[/\\]/).pop();
                    }
                    
                    nodes.push({
                        isCenter: false,
                        title, type, icon, orbitRadius, color,
                        baseAngle: (Math.PI * 2 / count) * i,
                        speed: baseSpeed + (Math.random() * 0.0015 - 0.0007),
                        radius: 12 + Math.random() * 6,
                        driftX: Math.random() * 15 - 7.5,
                        driftY: Math.random() * 15 - 7.5,
                        x: center.x, y: center.y
                    });
                });
            };

            addOrbitRing(apps, "App Workspace", "💻", 170, "#b200ff", 0.0025);
            addOrbitRing(files, "File Editor", "📄", 260, "#00ff88", -0.002);
            addOrbitRing(urls, "Research", "🌐", 350, "#ff00e5", 0.0015);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isCanvasRunning) return;
            mousePos = { x: e.clientX, y: e.clientY };
            let found = null;
            for (let i = nodes.length - 1; i >= 0; i--) {
                const n = nodes[i];
                const dist = Math.hypot(mousePos.x - n.x, mousePos.y - n.y);
                if (dist < n.radius + 15) {
                    found = n;
                    break;
                }
            }
            
            if (found !== hoveredNode) {
                hoveredNode = found;
                if (hoveredNode) {
                    document.getElementById('tt-icon').innerText = hoveredNode.icon;
                    document.getElementById('tt-type').innerText = hoveredNode.type;
                    document.getElementById('tt-title').innerText = hoveredNode.title;
                    tooltip.style.left = hoveredNode.x + 'px';
                    tooltip.style.top = hoveredNode.y + 'px';
                    tooltip.classList.add('visible');
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.classList.remove('visible');
                    canvas.style.cursor = 'default';
                }
            }
        });

        function render() {
            if (!isCanvasRunning) return;

            // Clear screen
            ctx.clearRect(0, 0, width, height);
            
            // Draw Parallax Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.x = (s.x - s.speed * (mousePos.x - center.x) * 0.04 + 2000) % 2000;
                s.y = (s.y - s.speed * (mousePos.y - center.y) * 0.04 + 2000) % 2000;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            globalAngleOffset += 0.0012;
            const t = Date.now() * 0.001;

            // Update positions
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                if (n.isCenter) {
                    n.x = center.x + Math.sin(t * 0.5) * 8;
                    n.y = center.y + Math.cos(t * 0.7) * 8;
                } else {
                    const currentAngle = n.baseAngle + globalAngleOffset + (t * n.speed);
                    const driftX = Math.sin(t + n.driftX) * 10;
                    const driftY = Math.cos(t + n.driftY) * 10;
                    n.x = center.x + Math.cos(currentAngle) * n.orbitRadius + driftX;
                    n.y = center.y + Math.sin(currentAngle) * n.orbitRadius + driftY;
                }
            }

            // Draw Connection Tethers
            ctx.lineWidth = 1;
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                if (!n.isCenter) {
                    const isHovered = (hoveredNode === n || (hoveredNode && hoveredNode.isCenter));
                    ctx.strokeStyle = isHovered ? 'rgba(0, 229, 255, 0.35)' : 'rgba(255, 255, 255, 0.06)';
                    ctx.beginPath();
                    ctx.moveTo(nodes[0]?.x || center.x, nodes[0]?.y || center.y);
                    ctx.lineTo(n.x, n.y);
                    ctx.stroke();
                }
            }

            // Draw Orbs
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                const isHovered = hoveredNode === n;
                const r = isHovered ? n.radius * 1.25 : n.radius;
                
                // Glow
                ctx.fillStyle = n.color + (isHovered ? '40' : '20');
                ctx.beginPath();
                ctx.arc(n.x, n.y, r * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Core Ring
                ctx.strokeStyle = isHovered ? '#ffffff' : n.color;
                ctx.lineWidth = isHovered ? 2 : 1.5;
                ctx.beginPath();
                ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
                ctx.stroke();
                
                // Nucleus
                ctx.fillStyle = isHovered ? '#ffffff' : n.color;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Icon
                if (n.radius > 18 || isHovered) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${isHovered ? 13 : 20}px system-ui`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const yOffset = n.radius > 18 ? 0 : -20;
                    ctx.fillText(n.icon, n.x, n.y + yOffset);
                }
            }
            
            // Tooltip position
            if (hoveredNode) {
                tooltip.style.left = hoveredNode.x + 'px';
                tooltip.style.top = hoveredNode.y + 'px';
            }

            animationFrameId = requestAnimationFrame(render);
        }

        function startCanvas() {
            if (!isCanvasRunning) {
                isCanvasRunning = true;
                animationFrameId = requestAnimationFrame(render);
            }
        }

        function stopCanvas() {
            isCanvasRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            ctx.clearRect(0, 0, width, height);
        }

        // Overlay Toggle Logic
        irisBridge.onOverlayToggle(() => {
            if (document.body.classList.contains('active')) {
                closeSequence();
            } else {
                openSequence();
            }
        });

        function openSequence() {
            requestAnimationFrame(() => {
                document.body.classList.add('active');
                irisBridge.overlaySetIgnoreMouse(false);
                startCanvas();
            });
        }

        function closeSequence() {
            document.body.classList.remove('active');
            irisBridge.overlaySetIgnoreMouse(true);
            stopCanvas();
            setTimeout(() => {
                irisBridge.overlayHide();
            }, 400);
        }

        document.getElementById('veil').addEventListener('click', closeSequence);

        // --- BUTTERY SMOOTH CINEMATIC RESTORE LOGIC ---
        const overlay = document.getElementById('cinematic-overlay');
        const items = document.getElementById('c-items');
        const summary = document.getElementById('c-summary');
        const subtitle = document.getElementById('c-subtitle');
        const progressBar = document.getElementById('c-progress-bar');
        const progressFill = document.getElementById('c-progress-fill');
        
        let cardCount = 0;

        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, (character) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[character]);
        }

        function getCardIconMarkup(itemType, defaultIcon) {
            const t = (itemType || '').toLowerCase();
            if (t.includes('chrome') || t.includes('browser') || t.includes('web') || t.includes('url')) {
                return `
                    <div class="mini-icon-glow" style="border-color: rgba(0, 229, 255, 0.4); background: rgba(0, 229, 255, 0.12); color: #00e5ff;">
                        🌐
                    </div>
                    <div class="mini-code-lines">
                        <div class="mini-line accent" style="width: 75%;"></div>
                        <div class="mini-line" style="width: 50%;"></div>
                    </div>
                `;
            }
            if (t.includes('code') || t.includes('vscode') || t.includes('cursor') || t.includes('editor')) {
                return `
                    <div class="mini-icon-glow" style="border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.12); color: #38bdf8;">
                        💻
                    </div>
                    <div class="mini-code-lines">
                        <div class="mini-line accent" style="width: 60%; background: #38bdf8;"></div>
                        <div class="mini-line" style="width: 85%;"></div>
                    </div>
                `;
            }
            if (t.includes('terminal') || t.includes('cmd') || t.includes('powershell') || t.includes('bash')) {
                return `
                    <div class="mini-icon-glow" style="border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.12); color: #a855f7;">
                        ⚡
                    </div>
                    <div class="mini-code-lines">
                        <div class="mini-line accent" style="width: 45%; background: #a855f7;"></div>
                        <div class="mini-line" style="width: 70%;"></div>
                    </div>
                `;
            }
            return `
                <div class="mini-icon-glow">
                    ${escapeHTML(defaultIcon || '🚀')}
                </div>
                <div class="mini-code-lines">
                    <div class="mini-line accent" style="width: 65%;"></div>
                    <div class="mini-line" style="width: 40%;"></div>
                </div>
            `;
        }

        irisBridge.onResumeSequence((data) => {
            if (data.type === 'start') {
                // Ensure canvas is paused to maximize FPS for reconstruction
                stopCanvas();
                
                cardCount = 0;
                items.innerHTML = '';
                summary.classList.remove('visible');
                progressBar.classList.add('visible');
                progressFill.style.width = '15%';
                subtitle.innerText = data.name ? `Restoring: ${data.name}` : 'Initializing cognitive anchors...';
                overlay.classList.add('active');
            } 
            else if (data.type === 'progress') {
                cardCount++;
                subtitle.innerText = data.message || 'Restoring environment...';
                
                // Update progress smoothly
                const progressPct = Math.min(25 + cardCount * 25, 85);
                progressFill.style.width = `${progressPct}%`;

                const card = document.createElement('div');
                card.className = 'holo-card';
                card.innerHTML = `
                    <div class="mini-window">
                        <div class="mini-header">
                            <div class="dots"><span></span><span></span><span></span></div>
                        </div>
                        <div class="mini-body">
                            ${getCardIconMarkup(data.item, data.icon)}
                        </div>
                    </div>
                    <div class="holo-subtitle" title="${escapeHTML(data.message)}">${escapeHTML(data.message)}</div>
                `;
                items.appendChild(card);
                
                // Double RAF guarantees GPU layer registration before animating
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        card.classList.add('animate-in');
                    });
                });
            } 
            else if (data.type === 'complete') {
                progressFill.style.width = '100%';
                subtitle.innerText = "Environment ready";
                summary.classList.add('visible');
                
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 2200);
            }
        });
        
        // Listen for Esc to close immediately
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.body.classList.contains('active')) {
                    closeSequence();
                } else if (overlay.classList.contains('active')) {
                    overlay.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
