<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target: CRM Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .crm-container { background: white; border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 30px; border-top: 4px solid #3b82f6; }
        .crm-header { border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; }
        .crm-title { font-size: 1.5rem; color: #1e293b; font-weight: 700; margin: 0; }
        .crm-subtitle { color: #64748b; font-size: 0.9rem; margin-top: 5px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        
        label { font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
        input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #0f172a; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn-container { margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-outline { background: white; border: 1px solid #cbd5e1; color: #475569; }
        .btn-primary { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div class="crm-container">
        <div class="crm-header">
            <h1 class="crm-title">Edit Customer Profile</h1>
            <div class="crm-subtitle">Update contact and employment details.</div>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="e.g. Jane">
            </div>
            
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="e.g. Doe">
            </div>
            
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" placeholder="Company Name">
            </div>
            
            <div class="form-group">
                <label for="jobTitle">Job Title</label>
                <input type="text" id="jobTitle" placeholder="e.g. Manager">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="(555) 000-0000">
            </div>
            
            <div class="form-group full-width">
                <label for="address">Full Mailing Address</label>
                <input type="text" id="address" placeholder="123 Main St, City, State ZIP">
            </div>
        </div>
        
        <div class="btn-container">
            <button class="btn btn-outline">Cancel</button>
            <button class="btn btn-primary">Save Profile</button>
        </div>
    </div>
</body>
</html>
